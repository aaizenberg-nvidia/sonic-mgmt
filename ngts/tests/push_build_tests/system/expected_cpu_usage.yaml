# In this file stored expected CPU usage in total and per process
# All values in %, all values for are for all available cores(maximum value is 100%)
# YAML file have next structure:
##master:                   <<< branch
##  DEFAULTS: &platform_defaults <<< title for default values for all of the platforms
##    total: 40          <<< default total expected CPU usage on DUT
##    sx_sdk: 30         <<< default CPU usage expected by process sx_sdk
##    syncd: 5           <<< default CPU usage expected by process syncd
##    snmpd: 2            <<< default CPU usage expected by process snmpd
##    zebra: 2            <<< default CPU usage expected by process zebra
##   ....
##   ....
##     sensord:
##       expected_value: 2      <<< default CPU usage expected by process sensord
##       no_simx_flag: True     <<< default flag if the process sensord doesn't run on simx platforms
##    ....
##    ....

##  MSN2010:                <<< platform
##    <<: *platform_defaults    <<< use default values for total and all of the processes
##    sx_sdk: 10          <<< redefine CPU usage expected by process sx_sdk for MSN2010 platform
##    syncd: 5             <<< redefine CPU usage expected by process syncd for MSN2010 platform
## In this case the expected values for MSN2010 is {'total':40, 'sx_sdk':10, 'syncd':5, 'snmpd':2,'zebra':2, ...}

master:
  #default
  DEFAULTS: &platform_defaults
    total: 40
    sx_sdk: 30
    syncd: 5
    redis-server: 5
    snmpd: 2
    zebra: 2
    bgpd: 2
    bgpcfgd: 2
    bgpmon: 2
    fpmsyncd: 2
    orchagent: 2
    ntpd: 2
    neighsyncd: 2
    vlanmgrd: 2
    intfmgrd: 2
    portmgrd: 2
    buffermgrd: 2
    vrfmgrd: 2
    nbrmgrd: 2
    vxlanmgrd: 2
    sensord:
      expected_value: 2
      no_simx_flag: True
  # SPC1
  SN2700: # Panther
    <<: *platform_defaults
    sx_sdk: 30
    syncd: 5
  MSN2700: # Simx Panther
    <<: *platform_defaults
    sx_sdk: 30
    syncd: 5
    redis-server: 8
  # SPC2
  MSN3420: # Lionfish
    <<: *platform_defaults
    sx_sdk: 10
    syncd: 5
  MSN3700: # Anaconda
    <<: *platform_defaults
    sx_sdk: 10
    syncd: 5
  MSN3700C: # Anaconda C
    <<: *platform_defaults
    sx_sdk: 10
    syncd: 5
  # SPC3
  SN4280: # Bobcat
    <<: *platform_defaults
    sx_sdk: 5
    syncd: 2
  MSN4600C: # Tigon
    <<: *platform_defaults
    sx_sdk: 5
    syncd: 2
  MSN4700: # Leopard
    <<: *platform_defaults
    sx_sdk: 5
    syncd: 2
  SN4700D: # Leopard DC
    <<: *platform_defaults
    sx_sdk: 5
    syncd: 2
  # SPC4
  SN5600: # Moose/Albatross
    <<: *platform_defaults
    sx_sdk: 5
    syncd: 2
  SN5610N: # Gaur
    <<: *platform_defaults
    sx_sdk: 5
    syncd: 2
  SN5640: # Bison
    <<: *platform_defaults
    sx_sdk: 5
    syncd: 2
  SN5810_LD: # Chameleon
    <<: *platform_defaults
    sx_sdk: 5
    syncd: 2
  SN6600: # Salamandra
    <<: *platform_defaults
    sx_sdk: 5
    syncd: 2
  SN6600_LD: # Salamandra SPC6
    <<: *platform_defaults
    sx_sdk: 5
    syncd: 2
  SN6810_LD: # Chameleon 6s
    <<: *platform_defaults
    sx_sdk: 5
    syncd: 2
