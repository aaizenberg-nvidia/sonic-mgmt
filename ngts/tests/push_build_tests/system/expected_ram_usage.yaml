# In this file stored expected RAM usage in total and per process
# All values in Mb
# YAML file have next structure:
#master:                   <<< branch
#  DEFAULTS: &platform_defaults <<< title for default values for all of the platforms
#    total: 5000          <<< default total expected RAM usage on DUT
#    sx_sdk: 1000         <<< default RAM usage expected by process sx_sdk
#    syncd: 300           <<< default RAM usage expected by process syncd
#    snmpd: 20            <<< default RAM usage expected by process snmpd
#    zebra: 85            <<< default RAM usage expected by process zebra
#    ....
#    ....
#     rsyslogd:
#      expected_value: 30   <<< default RAM usage expected by process rsyslogd
#      containers_list: ['gnmi',...,'database'] <<< default list of Docker containers in which the processes run
#    ....
#    ....
#  MSN3420:                <<< platform
#    <<: *platform_defaults    <<< use default values for total and all of the processes
#    total: 3750           <<< redefine total expected RAM usage on DUT for MSN3420 platform
#    sx_sdk: 1000          <<< redefine RAM usage expected by process sx_sdk for MSN3420 platform
#    syncd: 70             <<< redefine RAM usage expected by process syncd for MSN3420 platform
# In this case the expected values for MSN3420 is {'total':3750, 'sx_sdk':1000, 'syncd':70, 'snmpd':20,'zebra':85, ...}

master:
  #default
  DEFAULTS: &platform_defaults
    total: 5000
    sx_sdk: 1000
    syncd: 300
    snmpd: 20
    zebra: 85
    bgpd: 75
    bgpcfgd: 70
    bgpmon: 20
    fpmsyncd: 7
    orchagent: 103
    ntpd: 7
    neighsyncd: 7
    vlanmgrd: 7
    intfmgrd: 7
    portmgrd: 7
    buffermgrd: 7
    vrfmgrd: 7
    nbrmgrd: 7
    vxlanmgrd: 7
    sensord: 10
    sonic_ax_impl: 45
    rest_server: 60
    lldp_syncd: 20
    lldpd: 10
    lldpmgrd: 25
    dialout: 75
    telemetry: 70
    dhcprelayd: 11
    rsyslogd: &rsyslogd_defaults
      expected_value: 30
      containers_list: ['gnmi','dhcp_relay','what-just-happened','snmp','mgmt-framework','lldp','pmon','radv','syncd',
                        'bgp','teamd','swss','eventd','database']
    pcied: 25
    psud: 25
    syseepromd: 30
    thermalctld: 30
    xcvrd: 100
    teammgrd: 10
    teamsyncd: 10
    tlm_teamd: 10
