[pytest]
markers =
    nmx
    nv_bridge
    bios
    cpld
    ssd
    bmc
    fpga
    disable_loganalyzer
    ngts_skip
    build
    push_gate
    vlan
    fdb
    lldp
    rbac
    crl
    transceiver
    dhcp_relay
    dhcp6_relay
    wjh
    p4_sampling
    app_ext
    reboot_reload
    p4_examples
    doroce
    physical_coverage
    sflow
    skip_skynet
    skynet
    link_detection
    skip_clear_config : skips the clear_config function running at the end of a test
    general: nvue
    configuration: nvue
    chassis: nvue
    checklist: nvue
    ib: nvue
    lldp: nvue
    security: nvue
    init_flow: nvue
    system: nvue
    gnmi: nvue
    otel: nvue
    mtls: nvue
    syslog: nvue
    ib_interfaces: nvue
    security: nvue
    nvos_ci: nvue
    fae: nvue
    platform: nvue
    simx: nvue
    simx_security: nvue
    simx_xdr: nvue
    image: nvue
    log: nvue
    secure_boot: nvue
    login_ssh_notification: nvue
    openapi: nvue
    health: nvue
    cumulus: nvue
    nvos_chipsim_ci: nvue
    multiplanar: nvue
    interfaces: nvue
    system_profile_cleanup: nvue
    nvos_build: nvue
    nvos_security_build: nvue
    nvos_fw_update: nvue
    nvos_sdk_update: nvue
    nvos_mft_update: nvue
    nvos_sai_update: nvue
    nvue_core_update: nvue
    nvue_opensm_update: nvue
    nvue_ofed_update: nvue
    webserverapi: nvue
    banner: nvue
    tech_support: nvue
    certificate: nvue
    acl: nvue
    nvl_ci: nvue
    air: nvue
    air_ci: nvue
    air_sanity: nvue
    requires_hfnm: test needs a Host Fabric Node Manager (HFNM) in the topology to start the Subnet Manager and bring IB ports Active; skipped (with a visible reason) on setups without one - run on an HFNM-capable lab for real coverage
    bug(redmine, nvbugs, note): link the test to a known open bug (Redmine and/or NVbugs); surfaces as a clickable issue link and a filterable "Known open bug" bucket in the Allure report



log_cli = True
log_format = %(asctime)s [%(levelname)8s] (%(filename)s:%(lineno)s) %(message)s
log_date_format=%Y-%m-%d %H:%M:%S

# WA for the pytest 9.x treating these warnings as errors
# https://redmine.mellanox.com/issues/4829968
filterwarnings =
    ignore::pytest.PytestRemovedIn9Warning
